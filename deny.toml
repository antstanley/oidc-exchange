# Advisory interpretation and expiration are enforced by config/advisory-policy.json.
# cargo-deny remains pinned and emits the structural Cargo scanner report.
[advisories]
version = 2
yanked = "warn"
unmaintained = "all"
ignore = [
  "RUSTSEC-2023-0071",
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
  "RUSTSEC-2026-0258",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
