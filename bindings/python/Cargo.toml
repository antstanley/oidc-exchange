[package]
name = "oidc-exchange-python"
version.workspace = true
edition.workspace = true

[features]
default = []
conformance = ["oidc-exchange-ffi/conformance"]

[lib]
name = "_oidc_exchange"
crate-type = ["cdylib"]

[dependencies]
oidc-exchange-ffi = { path = "../../crates/ffi" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
