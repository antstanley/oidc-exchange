[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "oidc-exchange"
version = "0.1.0"
description = "Python bindings for oidc-exchange - OIDC token exchange service"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[dependency-groups]
dev = [
    "maturin>=1.14",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "werkzeug>=3.1",
    "ruff>=0.15",
    "pyright>=1.1.411",
]

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
python-source = "python"
module-name = "oidc_exchange._oidc_exchange"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pyright]
include = ["python"]
# Resolve the `oidc_exchange` package straight from the source tree so a bare
# `uv run pyright` type-checks without a `maturin develop` install step.
extraPaths = ["python"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

# oidc_exchange._oidc_exchange is the compiled native extension (maturin builds it
# from the Rust ffi crate via src/lib.rs). It ships no inline types; its typed
# surface is the hand-curated python/oidc_exchange/_oidc_exchange.pyi stub, which
# pyright resolves whether or not the .so is built. When the .so is absent
# (type-check-only runs) pyright would otherwise warn that the runtime module
# source is missing — silence only that, so the pure-Python sources stay strict.
reportMissingModuleSource = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
