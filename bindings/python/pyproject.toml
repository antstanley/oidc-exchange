[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "oidc-exchange"
version = "0.1.0"
description = "Python bindings for oidc-exchange - OIDC token exchange service"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[dependency-groups]
dev = [
    "maturin>=1.7",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "werkzeug>=3",
    "ruff>=0.11",
    "mypy>=2.1.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "oidc_exchange._oidc_exchange"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["python"]

# oidc_exchange._oidc_exchange is the compiled native extension (maturin builds it
# from the Rust ffi crate). It ships no importable Python stub, so when the .so is
# absent (type-check-only runs) mypy cannot resolve the import; the binding's typed
# surface lives in the hand-curated __init__.pyi wrapper. Scoped to this one module
# so the pure-Python sources stay strictly type-checked.
[[tool.mypy.overrides]]
module = ["oidc_exchange._oidc_exchange"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
