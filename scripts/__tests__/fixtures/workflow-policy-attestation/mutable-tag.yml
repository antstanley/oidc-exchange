on: push
jobs:
  build-binaries:
    permissions: {contents: read, id-token: write, attestations: write}
    steps:
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with: {subject-checksums: "target/${{ matrix.target }}/${{ matrix.artifact }}.sha256"}
  build-docker:
    permissions: {contents: read, packages: write, id-token: write, attestations: write}
    steps:
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with: {subject-name: "ghcr.io/${{ github.repository }}:latest", subject-digest: "${{ steps.build.outputs.digest }}"}
  docker-manifest:
    permissions: {contents: read, packages: write, id-token: write, attestations: write}
    steps:
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with: {subject-name: "ghcr.io/${{ github.repository }}", subject-digest: "${{ steps.manifest.outputs.digest }}"}
  create-release:
    needs: [build-binaries, docker-manifest]
    permissions: {contents: write}
    steps:
      - name: publish
        run: true
