[package]
name = "oidc-exchange-test-utils"
version.workspace = true
edition.workspace = true

[dependencies]
oidc-exchange-core.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
chrono.workspace = true
ulid.workspace = true
base64.workspace = true
ed25519-dalek = { version = "3.0.0-pre.6", features = ["rand_core"] }
# The shared leak-corpus capture harness renders telemetry through a fmt layer whose
# writer and span-lifecycle events the tests control. `tracing` is a direct dependency
# because the layer signatures name `tracing`'s span/event/visit types explicitly.
tracing.workspace = true
tracing-subscriber = "0.3"
