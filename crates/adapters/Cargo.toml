[package]
name = "oidc-exchange-adapters"
version.workspace = true
edition.workspace = true

[dependencies]
oidc-exchange-core.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
# "stream" backs http::read_bounded, which caps upstream bodies at MAX_UPSTREAM_BODY_BYTES
# by consuming response.bytes_stream() instead of an unbounded text().
reqwest = { version = "0.13", features = ["json", "form", "stream"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "pkcs8", "pem"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
base64.workspace = true
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
rsa = "0.10.0-rc.20"
p256 = { version = "0.14.0", features = ["ecdsa"] }
p384 = "0.14.0"
p521 = { version = "0.14.0", features = ["ecdsa"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
hmac = "0.13"
sha2 = "0.11"
heed = { version = "0.23", default-features = false }
hex.workspace = true
ulid.workspace = true
chrono.workspace = true
fred = { version = "10", features = ["serde-json", "i-scripts"] }
futures = "0.3"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "chrono", "json"] }

[dev-dependencies]
oidc-exchange-test-utils.workspace = true
wiremock = "0.6"
tempfile = "3"
rand.workspace = true
rsa = "0.10.0-rc.20"
tokio = { workspace = true, features = ["test-util"] }
# Interceptor support for the DynamoDB capacity-probe tests: must resolve to
# the same versions the SDK uses so the `Intercept` impl registers (the
# workspace lock already carries these for aws-sdk-dynamodb).
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
# Span-leak regression tests need a fmt subscriber whose writer they control and whose
# span lifecycle events (FmtSpan::CLOSE) they can enable explicitly.
tracing-subscriber = "0.3"
