name: Release
on:
  push:
    tags:
      - v*.*.*
env:
  CARGO_TERM_COLOR: always
jobs:
  dependency-policy:
    name: Dependency policy (release blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - name: Provision pinned scanners
        run: |
          cargo install cargo-deny --version 0.19.0 --locked
          python -m pip install --require-hashes --only-binary=:all: -r config/pip-audit-requirements.txt
          corepack pnpm@11.9.0 --version
      - name: Enforce frozen Cargo, pnpm, and Python graphs
        run: node scripts/run-advisory-scans.mjs
      - name: Enforce signing and verification paths
        run: node scripts/run-signing-path-policy.mjs
    permissions:
      contents: read
  validate:
    name: Validate Version
    needs: dependency-policy
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      npm_published: ${{ steps.preflight.outputs.npm_published }}
      pypi_published: ${{ steps.preflight.outputs.pypi_published }}
      docker_published: ${{ steps.preflight.outputs.docker_published }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Extract and validate version
        id: extract
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml workspace version ($CARGO_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

          NODE_VERSION=$(jq -r '.version' bindings/nodejs/package.json)
          if [ "$NODE_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version ($NODE_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

          PYTHON_VERSION=$(grep '^version' bindings/python/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$PYTHON_VERSION" != "$VERSION" ]; then
            echo "::error::pyproject.toml version ($PYTHON_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

          echo "All versions match: $VERSION"
      - name: Preflight — which registries already have this version
        id: preflight
        env:
          VERSION: ${{ steps.extract.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if npm view "@oidc-exchange/node@${VERSION}" version >/dev/null 2>&1; then npm=true; else npm=false; fi
          if curl -sf -o /dev/null "https://pypi.org/pypi/oidc-exchange/${VERSION}/json"; then pypi=true; else pypi=false; fi
          token=$(curl -s "https://ghcr.io/token?scope=repository:${GH_REPO}:pull" | jq -r '.token // empty')
          if [ -n "$token" ] && curl -sf -o /dev/null \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${GH_REPO}/manifests/${VERSION}"; then docker=true; else docker=false; fi
          {
            echo "npm_published=$npm"
            echo "pypi_published=$pypi"
            echo "docker_published=$docker"
          } >> "$GITHUB_OUTPUT"
          echo "Already published -> npm=$npm pypi=$pypi docker=$docker (matching build+publish jobs will be skipped)"
    permissions:
      contents: read
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: validate
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            artifact: oidc-exchange-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            artifact: oidc-exchange-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            artifact: oidc-exchange-windows-x64.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            artifact: oidc-exchange-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked
      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin oidc-exchange
          else
            cargo build --release --target ${{ matrix.target }} --bin oidc-exchange
          fi
      - name: Rename and checksum
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp oidc-exchange.exe "${{ matrix.artifact }}"
          else
            cp oidc-exchange "${{ matrix.artifact }}"
          fi
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - name: Attest release binary
        # actions/attest-build-provenance@v3
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-checksums: target/${{ matrix.target }}/release/${{ matrix.artifact }}.sha256
      - name: Smoke test
        if: "!matrix.use_cross"
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/${{ matrix.target }}/release/oidc-exchange.exe --version
          else
            ./target/${{ matrix.target }}/release/oidc-exchange --version
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.artifact }}
            target/${{ matrix.target }}/release/${{ matrix.artifact }}.sha256
    permissions:
      contents: read
      id-token: write
      attestations: write
  build-docker:
    name: Build Docker (${{ matrix.platform }})
    needs: validate
    if: ${{ needs.validate.outputs.docker_published != 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Prepare platform pair
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ghcr.io/${{ github.repository }}
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Attest platform image digest
        # actions/attest-build-provenance@v3
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
  docker-manifest:
    name: Merge Docker manifest
    needs: build-docker
    runs-on: ubuntu-latest
    environment: docker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/antstanley80/oidc-exchange
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - name: Resolve immutable multi-arch manifest digest
        id: manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | jq -r .)
          case "$digest" in
            sha256:[0-9a-f][0-9a-f]*) ;;
            *) echo "::error::invalid manifest digest: $digest"; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest multi-arch manifest digest
        # actions/attest-build-provenance@v3
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Inspect
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}@${{ steps.manifest.outputs.digest }}
      - name: Sync Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: antstanley80/oidc-exchange
          readme-filepath: ./README.docker.md
          short-description: Validate provider ID tokens and issue your own access/refresh JWTs
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
  build-nodejs:
    name: Build Node.js (${{ matrix.target }})
    needs: validate
    if: ${{ needs.validate.outputs.npm_published != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
      - name: Activate pnpm 11.9.0
        run: corepack pnpm@11.9.0 --version
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked
      - name: Install dependencies
        working-directory: bindings/nodejs
        run: corepack pnpm@11.9.0 install --frozen-lockfile
      - name: Build
        working-directory: bindings/nodejs
        run: corepack pnpm@11.9.0 exec --offline napi build --release --platform --target ${{ matrix.target }} ${{ matrix.use_cross && '--use-cross' || '' }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nodejs-${{ matrix.target }}
          path: bindings/nodejs/*.node
    permissions:
      contents: read
  publish-npm:
    name: Publish to npm
    needs:
      - build-nodejs
      - validate-npm-package
    permissions:
      contents: read
      id-token: write
    environment: publish
    runs-on: ubuntu-latest
    steps:
      - &a1
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - &a2
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
      - name: Download validated npm package tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: validated-npm-packages
          path: bindings/nodejs
      - name: Stage platform packages
        working-directory: bindings/nodejs
        run: |
          set -euo pipefail
          for pkg in darwin-arm64 linux-arm64-gnu linux-x64-gnu win32-x64-msvc; do
            name="@oidc-exchange/${pkg}"
            ver=$(node -p "require('./npm/${pkg}/package.json').version")
            if npm view "${name}@${ver}" version >/dev/null 2>&1; then
              echo "${name}@${ver} already published; skipping"
            else
              echo "staging ${name}@${ver}"
              # ./ prefix: stage the local directory. A bare "npm/<pkg>" is read
              # by npm as a github owner/repo shorthand and it tries to git-clone it.
              npm stage publish --provenance --access public --ignore-scripts "./npm/${pkg}"
            fi
          done
      - name: Stage @oidc-exchange/node
        working-directory: bindings/nodejs
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          if npm view "@oidc-exchange/node@${ver}" version >/dev/null 2>&1; then
            echo "@oidc-exchange/node@${ver} already published; skipping"
          else
            npm stage publish --provenance --access public --ignore-scripts
          fi
      - name: Build and stage @oidc-exchange/lambda
        working-directory: bindings/lambda
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          if npm view "@oidc-exchange/lambda@${ver}" version >/dev/null 2>&1; then
            echo "@oidc-exchange/lambda@${ver} already published; skipping"
          else
            corepack pnpm@11.9.0 install --frozen-lockfile --ignore-scripts
            corepack pnpm@11.9.0 run build
            corepack pnpm@11.9.0 pack --pack-destination "${RUNNER_TEMP}"
            npm stage publish --provenance --access public --ignore-scripts \
              "${RUNNER_TEMP}/oidc-exchange-lambda-${ver}.tgz"
          fi
      - name: List pending staged packages (approve these to go live)
        run: npm stage list || true
  build-python:
    name: Build Python (${{ matrix.target || matrix.command }})
    needs: validate
    if: ${{ needs.validate.outputs.pypi_published != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            command: build
            args: --release --out dist
            manylinux: 2_28
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            command: build
            args: --release --out dist
            manylinux: 2_28
          - target: aarch64-apple-darwin
            os: macos-latest
            command: build
            args: --release --out dist
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            command: build
            args: --release --out dist
          - os: ubuntu-latest
            command: sdist
            args: --out dist
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Build with maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: ${{ matrix.command }}
          args: ${{ matrix.args }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: bindings/python
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-${{ matrix.target || matrix.command }}
          path: bindings/python/dist/*
    permissions:
      contents: read
  publish-pypi:
    name: Publish to PyPI
    needs:
      - build-python
    permissions:
      id-token: write
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist/
          skip-existing: true
  create-release:
    name: Create GitHub Release
    needs:
      - validate
      - build-binaries
      - docker-manifest
      - publish-npm
      - publish-pypi
    if: ${{ !cancelled() && needs.build-binaries.result == 'success' && needs.docker-manifest.result != 'failure' && needs.publish-npm.result != 'failure' && needs.publish-pypi.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: binary-*
          path: release-artifacts
          merge-multiple: true
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)")
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }}
          body: |
            ## Changelog

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            ### Install Script

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            The installer requires GitHub build provenance when `gh` is available; otherwise it warns that checksum verification detects corruption but does not authenticate the release.

            ### Docker

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.version }}
            ```

            ### npm

            ```bash
            npm install @oidc-exchange/node@${{ needs.validate.outputs.version }}
            ```

            ### pip

            ```bash
            pip install oidc-exchange==${{ needs.validate.outputs.version }}
            ```
          files: |
            release-artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
  validate-npm-package:
    name: Validate npm packages
    needs: build-nodejs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - *a1
      - *a2
      - name: Activate pnpm 11.9.0
        run: corepack pnpm@11.9.0 --version
      - name: Install locked package tooling
        working-directory: bindings/nodejs
        run: corepack pnpm@11.9.0 install --frozen-lockfile --ignore-scripts
      - name: Sync platform package versions to the release version
        working-directory: bindings/nodejs
        run: corepack pnpm@11.9.0 exec --offline napi version
      - name: Download Node.js artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: nodejs-*
          path: bindings/nodejs/artifacts
          merge-multiple: true
      - name: Distribute binaries into platform packages
        working-directory: bindings/nodejs
        run: corepack pnpm@11.9.0 exec --offline napi artifacts
      - name: Verify every platform binary is present
        working-directory: bindings/nodejs
        run: |
          set -euo pipefail
          missing=0
          for pkg in darwin-arm64 linux-arm64-gnu linux-x64-gnu win32-x64-msvc; do
            node_file="npm/${pkg}/oidc-exchange.${pkg}.node"
            if [ -f "${node_file}" ]; then
              echo "ok: ${node_file}"
            else
              echo "::error::missing native binary: ${node_file}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::one or more platform packages are missing their .node binary; aborting publish"
            exit 1
          fi
      - name: Validate package metadata (publint)
        working-directory: bindings/nodejs
        run: corepack pnpm@11.9.0 exec --offline publint
      - name: Validate type definitions (arethetypeswrong)
        working-directory: bindings/nodejs
        run: corepack pnpm@11.9.0 exec --offline attw --pack --profile esm-only
      - name: Upload validated npm package tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-npm-packages
          path: bindings/nodejs
          include-hidden-files: false
