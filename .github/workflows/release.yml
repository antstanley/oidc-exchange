name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Extract and validate version
        id: extract
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml workspace version ($CARGO_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

          NODE_VERSION=$(jq -r '.version' bindings/nodejs/package.json)
          if [ "$NODE_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version ($NODE_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

          PYTHON_VERSION=$(grep '^version' bindings/python/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$PYTHON_VERSION" != "$VERSION" ]; then
            echo "::error::pyproject.toml version ($PYTHON_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

          echo "All versions match: $VERSION"

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: validate
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            artifact: oidc-exchange-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            artifact: oidc-exchange-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            artifact: oidc-exchange-windows-x64.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            artifact: oidc-exchange-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin oidc-exchange
          else
            cargo build --release --target ${{ matrix.target }} --bin oidc-exchange
          fi

      - name: Rename and checksum
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp oidc-exchange.exe "${{ matrix.artifact }}"
          else
            cp oidc-exchange "${{ matrix.artifact }}"
          fi
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Smoke test
        if: "!matrix.use_cross"
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/${{ matrix.target }}/release/oidc-exchange.exe --version
          else
            ./target/${{ matrix.target }}/release/oidc-exchange --version
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.artifact }}
            target/${{ matrix.target }}/release/${{ matrix.artifact }}.sha256

  build-docker:
    name: Build Docker Image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-nodejs:
    name: Build Node.js (${{ matrix.target }})
    needs: validate
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm add -g @napi-rs/cli
      - name: Install dependencies
        working-directory: bindings/nodejs
        run: pnpm install
      - name: Build
        working-directory: bindings/nodejs
        run: napi build --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodejs-${{ matrix.target }}
          path: bindings/nodejs/*.node

  publish-npm:
    name: Publish to npm
    needs: build-nodejs
    # Only this job is granted OIDC token-minting rights, so publish
    # credentials are never exposed to build or runtime code.
    permissions:
      id-token: write
      contents: read
    environment: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # >= 24.8.0 ships an npm new enough for OIDC trusted publishing.
          node-version: "24.8.0"
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Install napi CLI
        run: pnpm add -g @napi-rs/cli

      - name: Download Node.js artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nodejs-*
          path: bindings/nodejs/artifacts
          merge-multiple: true

      - name: Distribute binaries into platform packages
        working-directory: bindings/nodejs
        run: napi artifacts

      - name: Verify every platform binary is present
        working-directory: bindings/nodejs
        run: |
          set -euo pipefail
          missing=0
          for pkg in darwin-arm64 linux-arm64-gnu linux-x64-gnu win32-x64-msvc; do
            node_file="npm/${pkg}/oidc-exchange.${pkg}.node"
            if [ -f "${node_file}" ]; then
              echo "ok: ${node_file}"
            else
              echo "::error::missing native binary: ${node_file}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::one or more platform packages are missing their .node binary; aborting publish"
            exit 1
          fi

      - name: Validate package metadata (publint)
        working-directory: bindings/nodejs
        run: npx --yes publint

      - name: Validate type definitions (arethetypeswrong)
        working-directory: bindings/nodejs
        run: npx --yes @arethetypeswrong/cli --pack

      - name: Publish platform packages
        working-directory: bindings/nodejs
        # No auth token env: authentication is GitHub OIDC trusted publishing.
        run: |
          set -euo pipefail
          for pkg in darwin-arm64 linux-arm64-gnu linux-x64-gnu win32-x64-msvc; do
            echo "publishing @oidc-exchange/${pkg}"
            npm publish --provenance --access public --ignore-scripts "npm/${pkg}"
          done

      - name: Publish @oidc-exchange/node
        working-directory: bindings/nodejs
        run: npm publish --provenance --access public --ignore-scripts

      - name: Build and publish @oidc-exchange/lambda
        working-directory: bindings/lambda
        # pnpm publish rewrites the workspace: protocol dependency and, like the
        # steps above, authenticates via OIDC trusted publishing (no token).
        run: |
          pnpm install --ignore-scripts --no-frozen-lockfile
          pnpm build
          pnpm publish --provenance --access public --no-git-checks --ignore-scripts

  build-python:
    name: Build Python (${{ matrix.target }})
    needs: validate
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Build wheel
        working-directory: bindings/python
        run: uvx maturin build --release --target ${{ matrix.target }}
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-${{ matrix.target }}
          path: target/wheels/*.whl

  publish-python:
    name: Publish to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Download all wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-*
          path: wheels
          merge-multiple: true
      - name: Publish to PyPI
        run: uvx twine upload wheels/*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs:
      - validate
      - build-binaries
      - build-docker
      - publish-npm
      - publish-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)")
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }}
          body: |
            ## Changelog

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            ### Install Script

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            ### Docker

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.version }}
            ```

            ### npm

            ```bash
            npm install @oidc-exchange/node@${{ needs.validate.outputs.version }}
            ```

            ### pip

            ```bash
            pip install oidc-exchange==${{ needs.validate.outputs.version }}
            ```
          files: |
            release-artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
