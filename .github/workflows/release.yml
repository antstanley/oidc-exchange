name: Release
on:
  push:
    tags:
      - v*.*.*
env:
  CARGO_TERM_COLOR: always
jobs:
  dependency-policy:
    name: Dependency policy (release blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - name: Install cargo-binstall
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-binstall@1.26.2
      - name: Provision pinned scanners
        run: |
          # cargo-deny publishes no binstall metadata, so point binstall at the
          # author's own GitHub release (static musl build). No compile fallback.
          cargo binstall --no-confirm --strategies crate-meta-data --targets x86_64-unknown-linux-musl \
            --pkg-url '{ repo }/releases/download/{ version }/{ name }-{ version }-{ target }.tar.gz' \
            --bin-dir '{ name }-{ version }-{ target }/{ bin }{ binary-ext }' --pkg-fmt tgz \
            cargo-deny@0.20.2
          python -m pip install --require-hashes --only-binary=:all: -r config/pip-audit-requirements.txt
          pnpm --version
      - name: Enforce frozen Cargo, pnpm, and Python graphs
        run: node scripts/run-advisory-scans.mjs
      - name: Enforce signing and verification paths
        run: node scripts/run-signing-path-policy.mjs
    permissions:
      contents: read
  validate:
    name: Validate Version
    needs: dependency-policy
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      npm_published: ${{ steps.preflight.outputs.npm_published }}
      pypi_published: ${{ steps.preflight.outputs.pypi_published }}
      docker_published: ${{ steps.preflight.outputs.docker_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract and validate version
        id: extract
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml workspace version ($CARGO_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

          NODE_VERSION=$(jq -r '.version' bindings/nodejs/package.json)
          if [ "$NODE_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version ($NODE_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

          PYTHON_VERSION=$(grep '^version' bindings/python/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$PYTHON_VERSION" != "$VERSION" ]; then
            echo "::error::pyproject.toml version ($PYTHON_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

          echo "All versions match: $VERSION"
      - name: Preflight — which registries already have this version
        id: preflight
        env:
          VERSION: ${{ steps.extract.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if npm view "@oidc-exchange/node@${VERSION}" version >/dev/null 2>&1; then npm=true; else npm=false; fi
          if curl -sf -o /dev/null "https://pypi.org/pypi/oidc-exchange/${VERSION}/json"; then pypi=true; else pypi=false; fi
          token=$(curl -s "https://ghcr.io/token?scope=repository:${GH_REPO}:pull" | jq -r '.token // empty')
          if [ -n "$token" ] && curl -sf -o /dev/null \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${GH_REPO}/manifests/${VERSION}"; then docker=true; else docker=false; fi
          {
            echo "npm_published=$npm"
            echo "pypi_published=$pypi"
            echo "docker_published=$docker"
          } >> "$GITHUB_OUTPUT"
          echo "Already published -> npm=$npm pypi=$pypi docker=$docker (matching build+publish jobs will be skipped)"
    permissions:
      contents: read
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: validate
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            artifact: oidc-exchange-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            artifact: oidc-exchange-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            artifact: oidc-exchange-windows-x64.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            artifact: oidc-exchange-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-binstall
        if: matrix.use_cross
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-binstall@1.26.2
      - name: Install cross
        if: matrix.use_cross
        run: cargo binstall --no-confirm --strategies crate-meta-data cross@0.2.5
      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin oidc-exchange
          else
            cargo build --release --target ${{ matrix.target }} --bin oidc-exchange
          fi
      - name: Rename and checksum
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp oidc-exchange.exe "${{ matrix.artifact }}"
          else
            cp oidc-exchange "${{ matrix.artifact }}"
          fi
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - name: Attest release binary
        # actions/attest-build-provenance@v3
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: target/${{ matrix.target }}/release/${{ matrix.artifact }}.sha256
      - name: Smoke test
        if: "!matrix.use_cross"
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/${{ matrix.target }}/release/oidc-exchange.exe --version
          else
            ./target/${{ matrix.target }}/release/oidc-exchange --version
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.artifact }}
            target/${{ matrix.target }}/release/${{ matrix.artifact }}.sha256
    permissions:
      contents: read
      id-token: write
      attestations: write
  build-docker:
    name: Build Docker (${{ matrix.platform }})
    needs: validate
    if: ${{ needs.validate.outputs.docker_published != 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare platform pair
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Attest platform image digest
        # actions/attest-build-provenance@v3
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
  docker-manifest:
    name: Merge Docker manifest
    needs: build-docker
    runs-on: ubuntu-latest
    environment: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/antstanley80/oidc-exchange
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - name: Resolve immutable multi-arch manifest digest
        id: manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | jq -r .)
          case "$digest" in
            sha256:[0-9a-f][0-9a-f]*) ;;
            *) echo "::error::invalid manifest digest: $digest"; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest multi-arch manifest digest
        # actions/attest-build-provenance@v3
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Inspect
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}@${{ steps.manifest.outputs.digest }}
      - name: Sync Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: antstanley80/oidc-exchange
          readme-filepath: ./README.docker.md
          short-description: Validate provider ID tokens and issue your own access/refresh JWTs
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
  build-nodejs:
    name: Build Node.js (${{ matrix.target }})
    needs: validate
    if: ${{ needs.validate.outputs.npm_published != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Activate pnpm 12.16.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - name: Install cargo-binstall
        if: matrix.use_cross
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-binstall@1.26.2
      - name: Install cross
        if: matrix.use_cross
        run: cargo binstall --no-confirm --strategies crate-meta-data cross@0.2.5
      - name: Install dependencies
        working-directory: bindings/nodejs
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: bindings/nodejs
        run: pnpm exec napi build --release --platform --target ${{ matrix.target }} ${{ matrix.use_cross && '--use-cross' || '' }}
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodejs-${{ matrix.target }}
          path: bindings/nodejs/*.node
    permissions:
      contents: read
  publish-npm:
    name: Publish to npm
    needs:
      - build-nodejs
      - validate-npm-package
    permissions:
      contents: read
      id-token: write
    environment: publish
    runs-on: ubuntu-latest
    steps:
      - &a1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &a2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          registry-url: https://registry.npmjs.org
      - name: Activate pnpm 12.16.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - name: Download validated npm package tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-npm-packages
          path: bindings/nodejs
      - name: Stage platform packages
        working-directory: bindings/nodejs
        run: |
          set -euo pipefail
          for pkg in darwin-arm64 linux-arm64-gnu linux-x64-gnu win32-x64-msvc; do
            name="@oidc-exchange/${pkg}"
            ver=$(node -p "require('./npm/${pkg}/package.json').version")
            if npm view "${name}@${ver}" version >/dev/null 2>&1; then
              echo "${name}@${ver} already published; skipping"
            else
              echo "staging ${name}@${ver}"
              # ./ prefix: stage the local directory. A bare "npm/<pkg>" is read
              # by npm as a github owner/repo shorthand and it tries to git-clone it.
              npm stage publish --provenance --access public --ignore-scripts "./npm/${pkg}"
            fi
          done
      - name: Stage @oidc-exchange/node
        working-directory: bindings/nodejs
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          if npm view "@oidc-exchange/node@${ver}" version >/dev/null 2>&1; then
            echo "@oidc-exchange/node@${ver} already published; skipping"
          else
            npm stage publish --provenance --access public --ignore-scripts
          fi
      - name: Build and stage @oidc-exchange/lambda
        working-directory: bindings/lambda
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          if npm view "@oidc-exchange/lambda@${ver}" version >/dev/null 2>&1; then
            echo "@oidc-exchange/lambda@${ver} already published; skipping"
          else
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm run build
            pnpm pack --pack-destination "${RUNNER_TEMP}"
            npm stage publish --provenance --access public --ignore-scripts \
              "${RUNNER_TEMP}/oidc-exchange-lambda-${ver}.tgz"
          fi
      - name: List pending staged packages (approve these to go live)
        run: npm stage list || true
  build-python:
    name: Build Python (${{ matrix.target || matrix.command }})
    needs: validate
    if: ${{ needs.validate.outputs.pypi_published != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            command: build
            args: --release --out dist
            manylinux: 2_28
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            command: build
            args: --release --out dist
            manylinux: 2_28
          - target: aarch64-apple-darwin
            os: macos-latest
            command: build
            args: --release --out dist
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            command: build
            args: --release --out dist
          - os: ubuntu-latest
            command: sdist
            args: --out dist
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.16.0"
          command: ${{ matrix.command }}
          args: ${{ matrix.args }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: bindings/python
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target || matrix.command }}
          path: bindings/python/dist/*
    permissions:
      contents: read
  publish-pypi:
    name: Publish to PyPI
    needs:
      - build-python
    permissions:
      id-token: write
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
  publish-downloads:
    name: Sign and publish to dl.oidc-exchange.iamstan.dev
    needs:
      - validate
      - build-binaries
    runs-on: ubuntu-latest
    environment: downloads
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      BUCKET: oidc-exchange-downloads-115019372186
      DOWNLOAD_HOST: https://dl.oidc-exchange.iamstan.dev
      SIGNER_IDENTITY: https://github.com/antstanley/oidc-exchange/.github/workflows/release.yml@refs/tags/v${{ needs.validate.outputs.version }}
      SIGNER_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: release-artifacts
          merge-multiple: true
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Compose checksum manifest
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          # Every artifact must be present with its checksum before anything is signed.
          for artifact in oidc-exchange-linux-x64 oidc-exchange-linux-arm64 oidc-exchange-windows-x64.exe oidc-exchange-darwin-arm64; do
            test -f "$artifact" && test -f "$artifact.sha256" || { echo "::error::missing $artifact or its checksum"; exit 1; }
            sha256sum -c "$artifact.sha256"
          done
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Sign artifacts and manifest (Sigstore keyless)
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          for file in oidc-exchange-* SHA256SUMS; do
            case "$file" in *.sha256|*.sigstore.bundle) continue ;; esac
            cosign sign-blob --yes --bundle "$file.sigstore.bundle" "$file"
          done
      - name: Verify every bundle against the release identity
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          for file in oidc-exchange-* SHA256SUMS; do
            case "$file" in *.sha256|*.sigstore.bundle) continue ;; esac
            cosign verify-blob \
              --bundle "$file.sigstore.bundle" \
              --certificate-identity "$SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$SIGNER_ISSUER" \
              "$file"
          done
      - name: Assume upload role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::115019372186:role/oidc-exchange-downloads-upload
          aws-region: us-east-1
      - name: Upload immutable version prefix
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          # If-None-Match: * makes each write a conditional create, so a re-run of a
          # release can never replace bytes that were already signed and published.
          for file in oidc-exchange-* SHA256SUMS SHA256SUMS.sigstore.bundle; do
            [ -f "$file" ] || { echo "::error::missing $file"; exit 1; }
            aws s3api put-object \
              --bucket "$BUCKET" \
              --key "releases/v${VERSION}/${file}" \
              --body "$file" \
              --if-none-match '*' \
              --cache-control 'public, max-age=31536000, immutable' \
              --content-type application/octet-stream
          done
    permissions:
      contents: read
      id-token: write
  publish-latest:
    name: Publish latest.json
    needs:
      - validate
      - publish-downloads
    runs-on: ubuntu-latest
    environment: downloads
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      BUCKET: oidc-exchange-downloads-115019372186
      DOWNLOAD_HOST: https://dl.oidc-exchange.iamstan.dev
    steps:
      - name: Assume upload role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::115019372186:role/oidc-exchange-downloads-upload
          aws-region: us-east-1
      - name: Publish latest.json
        run: |
          set -euo pipefail
          # Separate job so it can be re-run alone: re-running publish-downloads would
          # fail its conditional create. Written only after the version prefix is
          # complete. The contract is a stable X.Y.Z, so a pre-release never becomes
          # "latest" (and sort -V ranks 1.2.3-rc.1 above 1.2.3).
          case "$VERSION" in *-*) echo "pre-release $VERSION; leaving latest.json"; exit 0 ;; esac
          # Fail closed on read errors: only a 404 means "no latest yet". The query
          # string bypasses the 60s CloudFront cache for this read.
          code=$(curl -sS --retry 5 --retry-all-errors --retry-delay 3 -o current.json -w '%{http_code}' \
            "${DOWNLOAD_HOST}/latest.json?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          case "$code" in
            404) current="" ;;
            200) current=$(jq -er '.version' current.json) ;;
            *) echo "::error::could not read current latest.json (HTTP $code); refusing to risk moving it backwards"; exit 1 ;;
          esac
          # Do not move "latest" backwards when an older tag is re-released.
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            echo "latest.json already at $current (newer than $VERSION); leaving it"
            exit 0
          fi
          jq -n --arg version "$VERSION" --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, publishedAt: $publishedAt}' > latest.json
          aws s3api put-object \
            --bucket "$BUCKET" \
            --key latest.json \
            --body latest.json \
            --cache-control 'public, max-age=60' \
            --content-type application/json
    permissions:
      contents: read
      id-token: write
  create-release:
    name: Create GitHub Release
    needs:
      - validate
      - build-binaries
      - docker-manifest
      - publish-npm
      - publish-pypi
    if: ${{ !cancelled() && needs.build-binaries.result == 'success' && needs.docker-manifest.result != 'failure' && needs.publish-npm.result != 'failure' && needs.publish-pypi.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: release-artifacts
          merge-multiple: true
      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          # Prefer the Changesets-curated section for this version (the @oidc-exchange/node
          # CHANGELOG is the canonical one for the fixed package group). Fall back to a
          # git-log summary for releases cut before Changesets or with no CHANGELOG section.
          CHANGELOG=""
          CL="bindings/nodejs/CHANGELOG.md"
          if [ -f "$CL" ]; then
            CHANGELOG=$(awk -v h="## $VERSION" 'index($0,h)==1{f=1;next} /^## /{f=0} f' "$CL" | sed '/./,$!d')
          fi
          if [ -z "$CHANGELOG" ]; then
            PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
            else
              CHANGELOG=$(git log --pretty=format:"- %s (%h)")
            fi
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }}
          body: |
            ## Changelog

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            ### Install Script

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            The installer downloads from `dl.oidc-exchange.iamstan.dev` (falling back to this release) and verifies the checksum, then the Sigstore signature when `cosign` is installed, otherwise the GitHub attestation when `gh` is installed. With neither, it loudly performs checksum-only corruption detection, not authentication.

            ### Verify a binary manually

            ```bash
            BASE=https://dl.oidc-exchange.iamstan.dev/releases/v${{ needs.validate.outputs.version }}
            curl -fsSLO "$BASE/oidc-exchange-linux-x64"
            curl -fsSLO "$BASE/oidc-exchange-linux-x64.sigstore.bundle"
            cosign verify-blob \
              --bundle oidc-exchange-linux-x64.sigstore.bundle \
              --certificate-identity https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/v${{ needs.validate.outputs.version }} \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              oidc-exchange-linux-x64
            ```

            ### Docker (GHCR build provenance)

            ```bash
            gh attestation verify oci://ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.version }} \
              --repo antstanley/oidc-exchange \
              --signer-workflow antstanley/oidc-exchange/.github/workflows/release.yml
            docker pull ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.version }}
            ```

            This verifies the immutable final multi-arch GHCR manifest's build provenance, not a registry signature. The Docker Hub copy is not claimed to carry a Docker Hub-verifiable attestation.

            ### npm

            ```bash
            npm install @oidc-exchange/node@${{ needs.validate.outputs.version }}
            ```

            ### pip

            ```bash
            pip install oidc-exchange==${{ needs.validate.outputs.version }}
            ```
          files: |
            release-artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
  validate-npm-package:
    name: Validate npm packages
    needs: build-nodejs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - *a1
      - *a2
      - name: Activate pnpm 12.16.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - name: Install locked package tooling
        working-directory: bindings/nodejs
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Sync platform package versions to the release version
        working-directory: bindings/nodejs
        run: pnpm exec napi version
      - name: Download Node.js artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nodejs-*
          path: bindings/nodejs/artifacts
          merge-multiple: true
      - name: Distribute binaries into platform packages
        working-directory: bindings/nodejs
        run: pnpm exec napi artifacts
      - name: Verify every platform binary is present
        working-directory: bindings/nodejs
        run: |
          set -euo pipefail
          missing=0
          for pkg in darwin-arm64 linux-arm64-gnu linux-x64-gnu win32-x64-msvc; do
            node_file="npm/${pkg}/oidc-exchange.${pkg}.node"
            if [ -f "${node_file}" ]; then
              echo "ok: ${node_file}"
            else
              echo "::error::missing native binary: ${node_file}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::one or more platform packages are missing their .node binary; aborting publish"
            exit 1
          fi
      - name: Validate package metadata (publint)
        working-directory: bindings/nodejs
        run: pnpm exec publint
      - name: Validate type definitions (arethetypeswrong)
        working-directory: bindings/nodejs
        run: pnpm exec attw --pack --profile esm-only
      - name: Upload validated npm package tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-npm-packages
          path: bindings/nodejs
          include-hidden-files: false
