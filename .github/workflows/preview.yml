name: PR preview

# Stand up a per-PR docs preview on open/update, tear it down on close/merge, the
# same shared-stack model blogwright uses for its own docs. Served at
# https://pr-<n>.preview.oidc-exchange.iamstan.dev (see config/preview.jsonc). The
# site builds inside blogwright's Lambda MicroVM; the runner only orchestrates via
# the blogwright CLI. Infra and the OIDC role come from `blogwright preview
# bootstrap` (account 403884279830).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # Only docs/site changes get a preview. Paths are evaluated against the PR's
    # full changed-file set, so the close-time destroy fires for exactly the PRs
    # that deployed.
    paths:
      - "apps/website/**"
      - "config/preview.jsonc"
      - ".github/workflows/preview.yml"

# Only one run per PR at a time; a new push cancels an in-flight deploy of the same PR.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  # Created by `blogwright preview bootstrap` (preview-oidc-exchange-gh). Same
  # preview account blogwright's own previews deploy from.
  ROLE_ARN: arn:aws:iam::403884279830:role/preview-oidc-exchange-gh
  PREVIEW_ID: pr-${{ github.event.pull_request.number }}
  PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.preview.oidc-exchange.iamstan.dev

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # assume the AWS role via OIDC
      pull-requests: write # comment the preview URL
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - name: Activate pnpm 11.9.0
        run: |
          corepack enable
          corepack pnpm@11.9.0 --version
      - name: Install workspace dependencies
        run: corepack pnpm@11.9.0 install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy preview
        run: corepack pnpm@11.9.0 exec blogwright preview deploy "$PREVIEW_ID"
      - name: Comment preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- preview-deploy -->';
            const body = `${marker}\n🚀 Preview deployed: ${url}\n\n_Updates on every push; removed when this PR closes._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  destroy:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # assume the AWS role via OIDC
      pull-requests: write # comment the removal
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - name: Activate pnpm 11.9.0
        run: |
          corepack enable
          corepack pnpm@11.9.0 --version
      - name: Install workspace dependencies
        run: corepack pnpm@11.9.0 install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Destroy preview
        run: corepack pnpm@11.9.0 exec blogwright preview destroy "$PREVIEW_ID"
      - name: Comment removal
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- preview-deploy -->';
            const body = `${marker}\n🧹 Preview removed.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            }
