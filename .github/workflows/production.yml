name: Deploy docs

# Publish the docs site (apps/website — Astro + Starlight, whose content is the
# repo's /docs tree via a symlink) to oidc-exchange.iamstan.dev with blogwright,
# using the same structure and AWS accounts blogwright uses for its own docs.
# Docs- or site-only changes go live on merge to main (path-filtered), and every
# GitHub release republishes so the docs track the released service. The site is
# built inside blogwright's Lambda MicroVM; this runner only orchestrates via the
# blogwright CLI (a workspace devDependency installed from npm). The OIDC role and
# infrastructure are created out of band by `blogwright bootstrap production`
# (account 115019372186); the sync only uploads/invalidates files that changed.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "config/production.jsonc"
      - ".github/workflows/production.yml"

# Queue production deploys instead of cancelling: killing a mid-run deploy leaks a
# running MicroVM and its pending job marker.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Created by `blogwright bootstrap production` (gh-oidc-role node; trust policy
  # scoped to config.githubRepo antstanley/oidc-exchange + the `production`
  # environment). Same account blogwright's own production docs deploy from.
  ROLE_ARN: arn:aws:iam::115019372186:role/production-oidc-exchange-gh

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # assume the AWS role via OIDC
    # Scopes the OIDC token subject to `…:environment:production` (the role's trust
    # policy requires it) and gates deploys behind environment protection rules.
    environment:
      name: production
      url: https://oidc-exchange.iamstan.dev
    steps:
      # A release event checks out the release's tag commit — that revision is
      # what gets built and published.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - name: Activate pnpm 11.9.0
        run: |
          corepack enable
          corepack pnpm@11.9.0 --version
      - name: Install workspace dependencies
        run: corepack pnpm@11.9.0 install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy docs to production
        # The docs site itself is built inside the MicroVM; the runner only runs
        # the blogwright CLI installed from the frozen workspace install.
        run: corepack pnpm@11.9.0 exec blogwright deploy production
