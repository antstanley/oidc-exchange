name: Node addon glibc floor
on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/nodejs-addon-glibc.yml
      - bindings/nodejs/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch: null
jobs:
  glibc-floor:
    name: linux-gnu addon glibc floor (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    env:
      MAX_GLIBC_MINOR: "34"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
      - name: Activate pnpm 11.9.0
        run: |
          # Enable the corepack shims so tools that spawn a bare `pnpm` resolve
          # through the repo's packageManager pin (pnpm@11.9.0); the explicit
          # pinned invocation below proves the exact version is provisioned.
          corepack enable
          corepack pnpm@11.9.0 --version
      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Install dependencies
        working-directory: bindings/nodejs
        run: corepack pnpm@11.9.0 install --frozen-lockfile
      - name: Build addon via cross
        working-directory: bindings/nodejs
        run: corepack pnpm@11.9.0 exec napi build --release --platform --target ${{ matrix.target }} --use-cross
      - name: Assert glibc floor <= 2.34
        working-directory: bindings/nodejs
        run: |
          set -euo pipefail
          node_file=$(ls -1 *.node | head -1)
          echo "Inspecting $node_file"
          # readelf reads version requirements from any ELF architecture (the runner
          # is x64 but the addon may be aarch64), unlike an arch-specific objdump.
          reqs=$(readelf -V "$node_file" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -u -V || true)
          if [ -z "$reqs" ]; then
            echo "::error::no GLIBC version requirements found in $node_file — cannot verify the floor"
            exit 1
          fi
          echo "GLIBC symbol requirements:"
          echo "$reqs"
          max=$(echo "$reqs" | tail -1 | sed 's/GLIBC_//')
          major=$(echo "$max" | cut -d. -f1)
          minor=$(echo "$max" | cut -d. -f2)
          echo "Highest required: glibc $max"
          if [ "$major" -ne 2 ] || [ "$minor" -gt "$MAX_GLIBC_MINOR" ]; then
            echo "::error::addon requires glibc $max (> 2.${MAX_GLIBC_MINOR}); it will not load on AWS Lambda AL2023 (glibc 2.34). See issue #11."
            exit 1
          fi
          echo "OK: addon glibc floor $max is <= 2.${MAX_GLIBC_MINOR} — loads on AL2023/Lambda."
    permissions:
      contents: read
