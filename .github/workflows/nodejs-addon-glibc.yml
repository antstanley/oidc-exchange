name: Node addon glibc floor
on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/nodejs-addon-glibc.yml
      - bindings/nodejs/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch: null
jobs:
  glibc-floor:
    name: linux-gnu addon glibc floor (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    env:
      MAX_GLIBC_MINOR: "34"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Activate pnpm 12.16.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - name: Install cargo-binstall
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-binstall@1.26.2
      - name: Install cross
        run: cargo binstall --no-confirm --strategies crate-meta-data cross@0.2.5
      - name: Install dependencies
        working-directory: bindings/nodejs
        run: pnpm install --frozen-lockfile
      - name: Build addon via cross
        working-directory: bindings/nodejs
        run: pnpm exec napi build --release --platform --target ${{ matrix.target }} --use-cross
      - name: Assert glibc floor <= 2.34
        working-directory: bindings/nodejs
        run: |
          set -euo pipefail
          node_file=$(ls -1 *.node | head -1)
          echo "Inspecting $node_file"
          # readelf reads version requirements from any ELF architecture (the runner
          # is x64 but the addon may be aarch64), unlike an arch-specific objdump.
          reqs=$(readelf -V "$node_file" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -u -V || true)
          if [ -z "$reqs" ]; then
            echo "::error::no GLIBC version requirements found in $node_file — cannot verify the floor"
            exit 1
          fi
          echo "GLIBC symbol requirements:"
          echo "$reqs"
          max=$(echo "$reqs" | tail -1 | sed 's/GLIBC_//')
          major=$(echo "$max" | cut -d. -f1)
          minor=$(echo "$max" | cut -d. -f2)
          echo "Highest required: glibc $max"
          if [ "$major" -ne 2 ] || [ "$minor" -gt "$MAX_GLIBC_MINOR" ]; then
            echo "::error::addon requires glibc $max (> 2.${MAX_GLIBC_MINOR}); it will not load on AWS Lambda AL2023 (glibc 2.34). See issue #11."
            exit 1
          fi
          echo "OK: addon glibc floor $max is <= 2.${MAX_GLIBC_MINOR} — loads on AL2023/Lambda."
    permissions:
      contents: read
