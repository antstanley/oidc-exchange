name: Windows build check
on:
  pull_request:
    paths:
      - crates/**
      - bindings/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/windows-build-check.yml
  workflow_dispatch: null
jobs:
  windows-check:
    name: cargo check (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo check for windows-msvc
        run: cargo check --workspace --exclude oidc-exchange-python --target x86_64-pc-windows-msvc
    permissions:
      contents: read
