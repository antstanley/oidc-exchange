name: Windows build check
on:
  pull_request:
    paths:
      - crates/**
      - bindings/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/windows-build-check.yml
  workflow_dispatch: null
jobs:
  windows-check:
    name: cargo check (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: cargo check for windows-msvc
        run: cargo check --workspace --exclude oidc-exchange-python --target x86_64-pc-windows-msvc
    permissions:
      contents: read
