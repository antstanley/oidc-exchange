name: CI
on:
  push:
    branches:
      - main
    # Docs-only changes ship through the blogwright deploy workflows and are
    # validated by the site build; they do not need the Rust/bindings build.
    paths-ignore:
      - "apps/website/src/content/docs/**"
  pull_request:
    paths-ignore:
      - "apps/website/src/content/docs/**"
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  advisories:
    name: Dependency advisories (reported policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - name: Install cargo-binstall
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-binstall@1.26.2
      - name: Provision pinned scanners
        run: |
          # cargo-deny publishes no binstall metadata, so point binstall at the
          # author's own GitHub release (static musl build). No compile fallback.
          cargo binstall --no-confirm --strategies crate-meta-data --targets x86_64-unknown-linux-musl \
            --pkg-url '{ repo }/releases/download/{ version }/{ name }-{ version }-{ target }.tar.gz' \
            --bin-dir '{ name }-{ version }-{ target }/{ bin }{ binary-ext }' --pkg-fmt tgz \
            cargo-deny@0.20.2
          python -m pip install --require-hashes --only-binary=:all: -r config/pip-audit-requirements.txt
          pnpm --version
      - name: Evaluate frozen Cargo, pnpm, and Python graphs
        run: node scripts/run-advisory-scans.mjs
      - name: Enforce signing and verification paths
        run: node scripts/run-signing-path-policy.mjs
    permissions:
      contents: read
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check --all
      - run: cargo clippy --workspace -- -D warnings
    permissions:
      contents: read
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: nextest
      - run: cargo nextest run --workspace
    permissions:
      contents: read
  nodejs-test:
    name: Node.js Binding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Activate pnpm 12.16.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - name: Install dependencies
        working-directory: bindings/nodejs
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: bindings/nodejs
        run: pnpm lint
      - name: Check formatting
        working-directory: bindings/nodejs
        run: pnpm format:check
      - name: Type-check
        working-directory: bindings/nodejs
        run: pnpm typecheck
      - name: Build native module
        working-directory: bindings/nodejs
        run: pnpm exec napi build --release --dts index.generated.d.ts
      - name: Run tests
        working-directory: bindings/nodejs
        run: pnpm test
      - name: Install Lambda adapter dependencies
        working-directory: bindings/lambda
        run: pnpm install --frozen-lockfile
      - name: Lint Lambda adapter
        working-directory: bindings/lambda
        run: pnpm lint
      - name: Check Lambda adapter formatting
        working-directory: bindings/lambda
        run: pnpm format:check
      - name: Type-check Lambda adapter
        working-directory: bindings/lambda
        run: pnpm typecheck
      - name: Build Lambda adapter
        working-directory: bindings/lambda
        run: pnpm build
      - name: Test Lambda adapter
        working-directory: bindings/lambda
        run: pnpm test
    permissions:
      contents: read
  python-test:
    name: Python Binding Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # abi3 wheel floor (3.11) plus the newest supported interpreters.
        python-version: ["3.11", "3.14", "3.15"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        working-directory: bindings/python
        # --group build adds the pinned maturin the develop/build steps invoke.
        run: uv sync --group build
      - name: Lint
        working-directory: bindings/python
        run: uv run ruff check .
      - name: Check formatting
        working-directory: bindings/python
        run: uv run ruff format --check .
      - name: Build Python module
        working-directory: bindings/python
        run: uv run maturin develop
      - name: Type-check
        working-directory: bindings/python
        run: uv run pyright
      - name: Run tests
        working-directory: bindings/python
        run: uv run pytest tests/

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: uv sync --project bindings/python --group build
      - name: Require executable cross-runtime parity
        run: node conformance/report.mjs

  web-apps:
    name: Web Apps (lint, format, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Activate pnpm 12.16.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Website — lint
        working-directory: apps/website
        run: pnpm lint
      - name: Website — format check
        working-directory: apps/website
        run: pnpm format:check
      - name: Website — type-check
        working-directory: apps/website
        run: pnpm typecheck
      - name: Admin UI — lint
        working-directory: apps/admin-ui
        run: pnpm lint
      - name: Admin UI — format check
        working-directory: apps/admin-ui
        run: pnpm format:check
      - name: Admin UI — type-check
        working-directory: apps/admin-ui
        run: pnpm typecheck
      - name: Admin UI — test
        working-directory: apps/admin-ui
        run: pnpm test
      - name: Unused code and dependencies (knip)
        run: pnpm knip
    permissions:
      contents: read
