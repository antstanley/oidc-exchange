name: CI
on:
  push:
    branches:
      - main
    # Docs-only changes ship through the blogwright deploy workflows and are
    # validated by the site build; they do not need the Rust/bindings build.
    paths-ignore:
      - "apps/website/src/content/docs/**"
  pull_request:
    paths-ignore:
      - "apps/website/src/content/docs/**"
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  advisories:
    name: Dependency advisories (reported policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - name: Provision pinned scanners
        run: |
          cargo install cargo-deny --version 0.19.0 --locked
          python -m pip install --require-hashes --only-binary=:all: -r config/pip-audit-requirements.txt
          corepack pnpm@11.9.0 --version
      - name: Evaluate frozen Cargo, pnpm, and Python graphs
        run: node scripts/run-advisory-scans.mjs
      - name: Enforce signing and verification paths
        run: node scripts/run-signing-path-policy.mjs
    permissions:
      contents: read
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - run: cargo fmt --check --all
      - run: cargo clippy --workspace -- -D warnings
    permissions:
      contents: read
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - uses: taiki-e/install-action@83a8c001de7da72527da9df53f6ef9d3a1f5b3e2
      - run: cargo nextest run --workspace
    permissions:
      contents: read
  nodejs-test:
    name: Node.js Binding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
      - name: Activate pnpm 11.9.0
        run: |
          # Enable the corepack shims so later bare `pnpm` script steps resolve
          # through the repo's packageManager pin (pnpm@11.9.0); the explicit
          # pinned invocation below proves the exact version is provisioned.
          corepack enable
          corepack pnpm@11.9.0 --version
      - name: Install dependencies
        working-directory: bindings/nodejs
        run: corepack pnpm@11.9.0 install --frozen-lockfile
      - name: Lint
        working-directory: bindings/nodejs
        run: pnpm lint
      - name: Check formatting
        working-directory: bindings/nodejs
        run: pnpm format:check
      - name: Type-check
        working-directory: bindings/nodejs
        run: pnpm typecheck
      - name: Build native module
        working-directory: bindings/nodejs
        run: corepack pnpm@11.9.0 exec napi build --release --dts index.generated.d.ts
      - name: Run tests
        working-directory: bindings/nodejs
        run: pnpm test
      - name: Install Lambda adapter dependencies
        working-directory: bindings/lambda
        run: corepack pnpm@11.9.0 install --frozen-lockfile
      - name: Lint Lambda adapter
        working-directory: bindings/lambda
        run: pnpm lint
      - name: Check Lambda adapter formatting
        working-directory: bindings/lambda
        run: pnpm format:check
      - name: Type-check Lambda adapter
        working-directory: bindings/lambda
        run: pnpm typecheck
      - name: Build Lambda adapter
        working-directory: bindings/lambda
        run: pnpm build
      - name: Test Lambda adapter
        working-directory: bindings/lambda
        run: pnpm test
    permissions:
      contents: read
  python-test:
    name: Python Binding Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - name: Install dependencies
        working-directory: bindings/python
        # --group build adds the pinned maturin the develop/build steps invoke.
        run: uv sync --group build
      - name: Lint
        working-directory: bindings/python
        run: uv run ruff check .
      - name: Check formatting
        working-directory: bindings/python
        run: uv run ruff format --check .
      - name: Build Python module
        working-directory: bindings/python
        run: uv run maturin develop
      - name: Type-check
        working-directory: bindings/python
        run: uv run pyright
      - name: Run tests
        working-directory: bindings/python
        run: uv run pytest tests/

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: corepack pnpm@11.9.0 install --frozen-lockfile --ignore-scripts
      - run: uv sync --project bindings/python --group build
      - name: Require executable cross-runtime parity
        run: node conformance/report.mjs

  web-apps:
    name: Web Apps (lint, format, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
      - name: Activate pnpm 11.9.0
        run: |
          # Enable the corepack shims so later bare `pnpm` script steps resolve
          # through the repo's packageManager pin (pnpm@11.9.0); the explicit
          # pinned invocation below proves the exact version is provisioned.
          corepack enable
          corepack pnpm@11.9.0 --version
      - name: Install dependencies
        run: corepack pnpm@11.9.0 install --frozen-lockfile
      - name: Website — lint
        working-directory: apps/website
        run: pnpm lint
      - name: Website — format check
        working-directory: apps/website
        run: pnpm format:check
      - name: Website — type-check
        working-directory: apps/website
        run: pnpm typecheck
      - name: Admin UI — lint
        working-directory: apps/admin-ui
        run: pnpm lint
      - name: Admin UI — format check
        working-directory: apps/admin-ui
        run: pnpm format:check
      - name: Admin UI — type-check
        working-directory: apps/admin-ui
        run: pnpm typecheck
      - name: Admin UI — test
        working-directory: apps/admin-ui
        run: pnpm test
    permissions:
      contents: read
