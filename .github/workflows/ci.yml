name: CI
on:
  push:
    branches:
      - main
  pull_request: null
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - run: cargo fmt --check --all
      - run: cargo clippy --workspace -- -D warnings
    permissions:
      contents: read
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - uses: taiki-e/install-action@83a8c001de7da72527da9df53f6ef9d3a1f5b3e2
      - run: cargo nextest run --workspace
    permissions:
      contents: read
  nodejs-test:
    name: Node.js Binding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
      - name: Activate pnpm 11.9.0
        run: corepack pnpm@11.9.0 --version
      - name: Install dependencies
        working-directory: bindings/nodejs
        run: corepack pnpm@11.9.0 install --frozen-lockfile
      - name: Lint
        working-directory: bindings/nodejs
        run: pnpm lint
      - name: Check formatting
        working-directory: bindings/nodejs
        run: pnpm format:check
      - name: Type-check
        working-directory: bindings/nodejs
        run: pnpm typecheck
      - name: Build native module
        working-directory: bindings/nodejs
        run: corepack pnpm@11.9.0 exec --offline napi build --release --dts index.generated.d.ts
      - name: Run tests
        working-directory: bindings/nodejs
        run: pnpm test
      - name: Install Lambda adapter dependencies
        working-directory: bindings/lambda
        run: corepack pnpm@11.9.0 install --frozen-lockfile
      - name: Lint Lambda adapter
        working-directory: bindings/lambda
        run: pnpm lint
      - name: Check Lambda adapter formatting
        working-directory: bindings/lambda
        run: pnpm format:check
      - name: Type-check Lambda adapter
        working-directory: bindings/lambda
        run: pnpm typecheck
      - name: Build Lambda adapter
        working-directory: bindings/lambda
        run: pnpm build
      - name: Test Lambda adapter
        working-directory: bindings/lambda
        run: pnpm test
    permissions:
      contents: read
  python-test:
    name: Python Binding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - name: Install dependencies
        working-directory: bindings/python
        run: uv sync
      - name: Lint
        working-directory: bindings/python
        run: uv run ruff check .
      - name: Check formatting
        working-directory: bindings/python
        run: uv run ruff format --check .
      - name: Build Python module
        working-directory: bindings/python
        run: uv run maturin develop
      - name: Type-check
        working-directory: bindings/python
        run: uv run pyright
      - name: Run tests
        working-directory: bindings/python
        run: uv run pytest tests/
    permissions:
      contents: read
  web-apps:
    name: Web Apps (lint, format, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
      - name: Activate pnpm 11.9.0
        run: corepack pnpm@11.9.0 --version
      - name: Install dependencies
        run: corepack pnpm@11.9.0 install --frozen-lockfile
      - name: Website — lint
        working-directory: apps/website
        run: pnpm lint
      - name: Website — format check
        working-directory: apps/website
        run: pnpm format:check
      - name: Website — type-check
        working-directory: apps/website
        run: pnpm typecheck
      - name: Admin UI — lint
        working-directory: apps/admin-ui
        run: pnpm lint
      - name: Admin UI — format check
        working-directory: apps/admin-ui
        run: pnpm format:check
      - name: Admin UI — type-check
        working-directory: apps/admin-ui
        run: pnpm typecheck
    permissions:
      contents: read
