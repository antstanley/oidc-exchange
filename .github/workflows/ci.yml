name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --check --all
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@83a8c001de7da72527da9df53f6ef9d3a1f5b3e2 # nextest
      - run: cargo nextest run --workspace

  nodejs-test:
    name: Node.js Binding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm add -g @napi-rs/cli
      - name: Install dependencies
        working-directory: bindings/nodejs
        run: pnpm install
      - name: Lint
        working-directory: bindings/nodejs
        run: pnpm lint
      - name: Check formatting
        working-directory: bindings/nodejs
        run: pnpm format:check
      - name: Type-check
        working-directory: bindings/nodejs
        run: pnpm typecheck
      - name: Build native module
        working-directory: bindings/nodejs
        # Redirect napi's auto-generated .d.ts to a throwaway file so it never
        # overwrites the hand-curated index.d.ts. napi rebuilds the .d.ts from
        # proc-macro output, which is empty when the crate is restored from the
        # build cache instead of recompiled — that produced a non-module
        # index.d.ts and broke the Lambda adapter's `tsc` build below.
        run: napi build --release --dts index.generated.d.ts
      - name: Run tests
        working-directory: bindings/nodejs
        run: pnpm test
      - name: Install Lambda adapter dependencies
        working-directory: bindings/lambda
        run: pnpm install
      - name: Lint Lambda adapter
        working-directory: bindings/lambda
        run: pnpm lint
      - name: Check Lambda adapter formatting
        working-directory: bindings/lambda
        run: pnpm format:check
      - name: Type-check Lambda adapter
        working-directory: bindings/lambda
        run: pnpm typecheck
      - name: Build Lambda adapter
        working-directory: bindings/lambda
        run: pnpm build
      - name: Test Lambda adapter
        working-directory: bindings/lambda
        run: pnpm test

  python-test:
    name: Python Binding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install dependencies
        working-directory: bindings/python
        run: uv sync
      - name: Lint
        working-directory: bindings/python
        run: uv run ruff check .
      - name: Check formatting
        working-directory: bindings/python
        run: uv run ruff format --check .
      - name: Build Python module
        working-directory: bindings/python
        run: uv run maturin develop
      - name: Type-check
        working-directory: bindings/python
        run: uv run pyright
      - name: Run tests
        working-directory: bindings/python
        run: uv run pytest tests/

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir bindings/nodejs exec napi build --release --dts index.generated.d.ts
      - run: pnpm --dir bindings/lambda build
      - run: uv sync --project bindings/python
      - run: uv run --project bindings/python maturin develop
      - name: Require executable cross-runtime parity
        run: node conformance/report.mjs

  web-apps:
    name: Web Apps (lint, format, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Install dependencies
        run: pnpm install
      - name: Website — lint
        working-directory: apps/website
        run: pnpm lint
      - name: Website — format check
        working-directory: apps/website
        run: pnpm format:check
      - name: Website — type-check
        working-directory: apps/website
        run: pnpm typecheck
      - name: Admin UI — lint
        working-directory: apps/admin-ui
        run: pnpm lint
      - name: Admin UI — format check
        working-directory: apps/admin-ui
        run: pnpm format:check
      - name: Admin UI — type-check
        working-directory: apps/admin-ui
        run: pnpm typecheck
