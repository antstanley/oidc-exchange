name: Version Packages
on:
  push:
    branches:
      - main
concurrency:
  group: version-packages
  cancel-in-progress: false
jobs:
  version:
    name: Open or update the Version Packages PR
    runs-on: ubuntu-latest
    steps:
      # No persisted credentials: changesets/action pushes the version commit and
      # opens the PR through the GitHub API using github-token, not the git CLI
      # (push-with-git-cli stays false), so the workflow-policy checkout rule holds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - name: Install workspace (frozen)
        run: pnpm install --frozen-lockfile
      - name: Version Packages
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
