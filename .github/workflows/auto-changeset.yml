name: Auto changeset
# Adds .changeset/auto-pr-<n>.md to a same-repo PR from its title and body unless the
# author wrote a changeset or labelled the PR `no-changeset`. pull_request_target runs
# the base branch's script; PR code is never checked out or executed, and the title and
# body reach the script through the event payload file, not shell interpolation.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]
concurrency:
  group: auto-changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changeset:
    name: Generate changeset
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Add or update the generated changeset
        run: node scripts/auto-changeset.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
