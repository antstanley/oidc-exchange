[package]
name = "oidc-exchange-conformance"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
oidc-exchange = { path = "../crates/server", features = ["conformance"] }
oidc-exchange-ffi = { path = "../crates/ffi", features = ["conformance"] }
axum = "0.8"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
