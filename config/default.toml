[server]
host = "0.0.0.0"
port = 8080
issuer = "https://localhost:8080"
role = "all"
request_timeout = "30s"

[registration]
mode = "open"

[token]
access_token_ttl = "15m"
refresh_token_ttl = "30d"
audience = "oidc-exchange"

[audit]
adapter = "noop"
blocking_threshold = "warning"
emit_threshold = "info"

[telemetry]
enabled = false
exporter = "none"
