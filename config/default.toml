[server]
host = "0.0.0.0"
port = 8080
trusted_proxies = []
trusted_proxy_hops = 1

[registration]
mode = "open"

[token]
access_token_ttl = "15m"
refresh_token_ttl = "30d"

[audit]
adapter = "stdout"
blocking_threshold = "warning"
emit_threshold = "info"
durability = "observe"

[rate_limit]
enabled = true
store = "in_process"
window = "1m"
per_ip = 60
per_ip_failures = 10
per_subject = 10
per_provider = 600
max_concurrent_requests = 256
max_entries = 10000

[telemetry]
enabled = false
exporter = "none"
