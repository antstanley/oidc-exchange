[server]
host = "0.0.0.0"
port = 8080
issuer = "https://auth.example.com"
role = "exchange"
request_timeout = "30s"
trusted_proxies = []
trusted_proxy_hops = 1

[registration]
mode = "open"

# Opt-in session location. Name the request headers a trusted proxy sets; an empty
# name disables that field. Headers are honoured only from `server.trusted_proxies`
# peers unless `trust_headers_from_any_peer = true`, which asserts the origin is
# reachable only through the proxy that sets them.
[session.location]
city_header = ""
region_header = ""
country_header = ""
ip_header = ""
trust_headers_from_any_peer = false

[token]
access_token_ttl = "15m"
refresh_token_ttl = "30d"
audience = "https://api.example.com"
refresh_rotation = true
refresh_rotation_grace = "10s"
refresh_reuse_retention = "24h"

[key_manager]
# Deliberate raw default for a minimal config; deployment overlays select a key adapter.
adapter = "oidc"

[repository]
# Deliberate raw default for a minimal config; deployment overlays select a repository adapter.
adapter = "oidc"

[session_repository]
cleanup_interval = "1h"

[audit]
adapter = "stdout"
blocking_threshold = "warning"
emit_threshold = "info"
durability = "observe"

[rate_limit]
enabled = true
store = "in_process"
window = "1m"
per_ip = 60
per_ip_failures = 10
per_subject = 10
per_provider = 600
max_concurrent_requests = 256
max_entries = 10000

[telemetry]
enabled = false
exporter = "none"
